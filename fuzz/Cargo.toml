# Fuzzing long (cargo-fuzz, libFuzzer) : hors de l'espace de travail, compilé
# avec la chaîne nightly. Lancé chaque nuit par .github/workflows/fuzz.yml.
#   cargo +nightly fuzz run --target x86_64-unknown-linux-gnu net_message -- -max_total_time=60
[package]
name = "uturoa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
borsh = { version = "1", features = ["derive"] }
uturoa-core = { path = "../crates/uturoa-core" }
uturoa-crypto = { path = "../crates/uturoa-crypto" }
uturoa-state = { path = "../crates/uturoa-state" }
uturoa-consensus = { path = "../crates/uturoa-consensus" }
uturoa-node = { path = "../crates/uturoa-node" }

[[bin]]
name = "net_message"
path = "fuzz_targets/net_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction"
path = "fuzz_targets/transaction.rs"
test = false
doc = false
bench = false

[workspace]
