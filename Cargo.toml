[workspace]
members = [
    "crates/uturoa-crypto",
    "crates/uturoa-core",
    "crates/uturoa-consensus",
    "crates/uturoa-state",
    "crates/uturoa-pow",
    "crates/uturoa-node",
    "crates/uturoa-keystore",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HaitoDann/Uturoa"

[workspace.dependencies]
uturoa-crypto = { path = "crates/uturoa-crypto" }
uturoa-keystore = { path = "crates/uturoa-keystore" }
uturoa-core = { path = "crates/uturoa-core" }
uturoa-consensus = { path = "crates/uturoa-consensus" }
uturoa-state = { path = "crates/uturoa-state" }
uturoa-pow = { path = "crates/uturoa-pow" }
uturoa-node = { path = "crates/uturoa-node" }
anyhow = "1"
argon2 = "0.5"
bech32 = "0.9"
blake3 = "1"
borsh = { version = "1", features = ["derive", "rc"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
randomx-rs = "1.6"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
redb = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

# Toute arithmétique doit être explicite (checked_*, saturating_*) : un
# dépassement silencieux sur un montant ou une hauteur est un bug de consensus.
# Un panic dans le nœud est un déni de service : pas d'unwrap ni d'expect hors tests.
[workspace.lints.clippy]
arithmetic_side_effects = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# Les dépendances (cryptographie) optimisées même en debug : tests bien plus rapides.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
