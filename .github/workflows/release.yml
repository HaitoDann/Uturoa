name: Release

# Publie les binaires de uturoa-node quand une version est créée :
#   GitHub → Releases → Draft a new release → tag vX.Y.Z sur main → Publish.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Binaire ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: uturoa-node
          - os: windows-latest
            name: windows-x86_64
            exe: uturoa-node.exe
          - os: macos-latest
            name: macos-arm64
            exe: uturoa-node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p uturoa-node
      - name: Archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          dir="uturoa-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" "$dir/"
          cp README.md LICENSE docs/TESTNET-LOCAL.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Empreinte SHA-256
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - name: Joint à la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
